# Initial artifact size baselines are rounded-up review ceilings calibrated
# from issue #564's native aarch64 release/strip wheel and standalone sdist.
# The other platform ceilings conservatively account for object-format and
# linker variation; the workflow records their exact first-run sizes.
# `python_artifacts.py inspect` fails when an artifact grows beyond the
# baseline plus the stated percentage. Update a baseline only after inspecting
# the logical archive diff and explaining the increase in the pull request.
#
# `baseline_unpacked_bytes` provides the same ratchet for the sum of member
# sizes, while `max_entries` catches accidental trees of many small files.

# The sdist ratchets were recalibrated for #741, which projects the smusni
# S-expression notation from `jbotci-semantics` and adds 34 net logical
# members: five codegen files, the data `.gitattributes`, the generated
# smusni-v0 registry with its retained sources, the notation registry module,
# the `sexpr` modules, and the typed IR, less the retired flat renderer and
# writer. All three sdist ratchets moved together so the byte ceilings are not
# left marginal while only the member count is raised; the growth allowance is
# unchanged. The byte baselines round up the *normalized* archive that
# `inspect` receives, not Maturin's raw output, because that is the artifact the
# ratchet compares. See that pull request for the measured archive diff.
[sizes.sdist]
baseline_bytes = 3600000
baseline_unpacked_bytes = 24000000
max_growth_percent = 15
max_entries = 280

[sizes.linux-x86_64]
baseline_bytes = 20000000
baseline_unpacked_bytes = 90000000
max_growth_percent = 25
max_entries = 32

[sizes.linux-aarch64]
baseline_bytes = 18500000
baseline_unpacked_bytes = 80000000
max_growth_percent = 20
max_entries = 32

[sizes.macos-x86_64]
baseline_bytes = 20000000
baseline_unpacked_bytes = 90000000
max_growth_percent = 25
max_entries = 32

[sizes.macos-aarch64]
