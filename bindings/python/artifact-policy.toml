# Initial artifact size baselines are rounded-up review ceilings calibrated
# from issue #564's native aarch64 release/strip wheel and standalone sdist.
# The other platform ceilings conservatively account for object-format and
# linker variation; the workflow records their exact first-run sizes.
# `python_artifacts.py inspect` fails when an artifact grows beyond the
# baseline plus the stated percentage. Update a baseline only after inspecting
# the logical archive diff and explaining the increase in the pull request.
#
# `baseline_unpacked_bytes` provides the same ratchet for the sum of member
# sizes, while `max_entries` catches accidental trees of many small files.

# The sdist ratchets were recalibrated *downward* for #753, which retires the
# smusni-v0 bundle's byte-mirrored generator-input tree along with the manifest
# and source-artifact tables it attested. The bundle now reads the live
# vendored dictionary snapshot instead of a second retained copy, so the
# archive loses 42 members and about 11.6 MB of duplicated bytes — most of it
# the ~9.9 MB dictionary. The remaining `build.rs` inputs are still packaged,
# and `crates/jbotci-semantics/tests/smusni_v0_bundle.rs` proves it.
#
# All three sdist ratchets move together, and the growth allowance is
# unchanged. The byte baselines round up the *normalized* archive that
# `inspect` receives, not Maturin's raw output, because that is the artifact
# the ratchet compares: measured 3,633,818 archive bytes, 24,117,331 unpacked
# bytes, and 253 members.
#
# Epic #801's deliberate generated-model growth through grammar-parity epoch 3
# brought the normalized sdist to 275 entries and the Linux aarch64 wheel to
# 95,029,675 unpacked bytes, within 5% of their prior ceilings. Recalibrate only
# those two marginal ratchets here; the post-epoch-11 closing sweep will
# re-ratchet the complete artifact policy after the generated model stabilizes.
# Epoch 4's sumti-continuation model brings the stripped aarch64 wheel to
# 22,106,247 archive bytes and 96,208,471 unpacked bytes. Both cross or remain
# within 5% of the sdist-wheel ceiling, so round up that nearest ratchet only;
# the 20% growth allowance and entry limit remain unchanged.
# Epoch 5's selbri reconstruction brings the manylinux 2.28 aarch64 wheel to
# 22,707,929 archive bytes and 98,781,023 unpacked bytes: 2.72% and 2.67% growth
# respectively from epoch 4. Only the compressed Linux aarch64 artifact crosses
# its existing ceiling, by 2.29%, so round that baseline to 19 MB; the unpacked
# and entry ratchets retain ample headroom.
# Epoch 6's composed term ladder grows the generated Python syntax models, which
# brings the stripped aarch64 wheel to 22,858,010 archive bytes and 99,789,122
# unpacked bytes across 24 entries: 0.67% and 0.92% growth over a control wheel
# built from epoch base a8b4f06227 with identical flags on the same host, and
# 0.66% / 1.02% over epoch 5. That is well inside the 5% audit band, but the
# compressed artifact clears the 22.8 MB ceiling by 0.25%, so round only that
# baseline up to 19.2 MB. The unpacked ratchet keeps 15% headroom and the entry
# limit is untouched. Local container tooling could not produce the manylinux
# 2.28 artifact for this measurement, so both wheels were built natively as
# manylinux 2.34; the base control lands within 0.01% of epoch 5's container
# number, which is what makes the delta comparable, and the python-wheels
# workflow remains the acceptance authority for the 2.28 artifact itself.
[sizes.sdist]
baseline_bytes = 3800000
baseline_unpacked_bytes = 24200000
max_growth_percent = 15
max_entries = 320

[sizes.linux-x86_64]
baseline_bytes = 20000000
baseline_unpacked_bytes = 90000000
max_growth_percent = 25
max_entries = 32

[sizes.linux-aarch64]
baseline_bytes = 19200000
baseline_unpacked_bytes = 96000000
max_growth_percent = 20
max_entries = 32

