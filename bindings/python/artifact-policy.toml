# Mechanical limits that `python_artifacts.py inspect` asserts on every wheel
# and source distribution the python-wheels workflow builds.
#
# There are deliberately NO per-platform byte budgets here. Until 2026-08-16 this
# file carried `baseline_bytes`, `baseline_unpacked_bytes` and
# `max_growth_percent` ratchets per platform key. They were project-invented --
# no publishing target imposes them -- and they fired on intended growth: epochs
# 3, 4, 5, 6 and 6b of epic #801 each spent a commit recalibrating whichever
# ceiling that epoch's larger generated parser and Python syntax models had
# crossed. A gate whose every firing reports work going as planned is not a gate,
# so the owner retired them.
#
# Artifact size is still tracked, as audit methodology rather than as a hard
# check: `inspect` writes an archive/unpacked/entry receipt for every artifact,
# the acceptance job publishes them as a size table, and each epoch compares its
# wheel against a control wheel built from the epoch base with identical flags on
# the same host and records the delta in the epoch ledger. A surprising delta is
# something to explain in review; it is not something CI fails on. Future epochs
# therefore carry no ratchet-recalibration commits.

[limits]
# One absolute per-file tripwire, shared by every wheel and the sdist. Its
# provenance is PyPI's hard 100 MiB (104,857,600 byte) per-file upload limit: an
# artifact above that cannot be published at all, whatever this project thinks of
# its size. 95 MiB leaves enough margin to notice the approach in review before a
# release run is the thing that discovers it.
max_artifact_bytes = 99614720

# Maximum logical members per archive. These archives package a fixed member
# list, so the entry count is a shape check, not a size one: a jump means an
# accidental tree of small files -- a `__pycache__`, a stray build directory, a
# vendored subtree -- rather than the packaged code growing.
[entries]
sdist = 320
linux-x86_64 = 32
linux-aarch64 = 32
macos-x86_64 = 32
macos-aarch64 = 32
windows-x86_64 = 32
sdist-wheel-x86_64 = 32
sdist-wheel-aarch64 = 32
