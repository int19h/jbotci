[package]
name = "jbotci-python"
description = "Private PyO3 extension module for the pre-alpha jbotci Python package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
expensive_contracts = []

[dependencies]
bityzba = { path = "../../crates/bityzba" }
jbotci-dictionary = { path = "../../crates/jbotci-dictionary" }
jbotci-dictionary-data = { path = "../../crates/jbotci-dictionary-data" }
jbotci-diagnostics = { path = "../../crates/jbotci-diagnostics" }
jbotci-dialect = { path = "../../crates/jbotci-dialect" }
jbotci-morphology = { path = "../../crates/jbotci-morphology" }
jbotci-phonetic = { path = "../../crates/jbotci-phonetic" }
jbotci-source = { path = "../../crates/jbotci-source" }
jbotci-syntax = { path = "../../crates/jbotci-syntax" }
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
vec1.workspace = true

[build-dependencies]
bityzba = { path = "../../crates/bityzba", features = ["contract_scanner"] }

[lints]
workspace = true
