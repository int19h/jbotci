[package]
name = "jbotci"
description = "Command-line Lojban toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
disable_contracts = ["bityzba/disable_contracts"]
expensive_contracts = []

[[bin]]
name = "jbotci"
path = "src/main.rs"

[lib]
name = "jbotci_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-lsp.workspace = true
bityzba.workspace = true
clap.workspace = true
clx.workspace = true
concolor.workspace = true
concolor-clap.workspace = true
jbotci-dialect.workspace = true
jbotci-diagnostics.workspace = true
jbotci-cll.workspace = true
jbotci-dictionary.workspace = true
jbotci-dictionary-data.workspace = true
jbotci-embeddings = { workspace = true, features = ["native-llama"] }
jbotci-gentufa.workspace = true
jbotci-gimfihi.workspace = true
jbotci-ide.workspace = true
jbotci-jvozba.workspace = true
jbotci-morphology.workspace = true
jbotci-output.workspace = true
jbotci-phonetic.workspace = true
jbotci-search.workspace = true
jbotci-source.workspace = true
jbotci-syntax.workspace = true
owo-colors.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "time"] }
tokio-util.workspace = true
tower.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }

[dev-dependencies]
base64.workspace = true
roxmltree.workspace = true

[lints]
workspace = true
