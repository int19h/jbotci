brackets = "(ni'o la .maĭkl. .turnĭanskis. di'e fínti ni'o le pa tírxu be me'e [zo .teris.] pu ki kánsa le za'u péndo be le neĭ le ka xábju le fóldi be loĭ spáti .i me le bi'u naĭ péndo fa le pa xánto be me'e [zo .elis.] fa le pa xirnzébra be me'e [zo .zoĭs.] .i la .teris. ze'e ta'e djíca le nu le neĭ cu lítru kláma le pa bárda tcádu noĭ fa'a ke'a ta'e ku le'e vínji ga'u vófli kláma .i se mu'i bo ca pa dónri la .teris. co'a cádzu kláma le bi'u naĭ bárda tcádu .i ba zi ku la .teris. co'a kláma le pa rírxe gi'e rétsku fi le pa fínpe pe ne'i le rírxe fe le se du'u ma kaŭ plúta le tcádu .i le fínpe fi la .teris. cu spúsku fe lu ko cádzu ne'a le bu'u rírxe ze'a le djédi be li ci .i ba bo do víska ru li'u .i la .teris. co'a se gídva tu'a [lu bu] .i je ca le fánmo be le ci moĭ be le'i dónri la .teris. cu víska le so'o te gúsni pe le bi'u naĭ .ŭi saĭ daĭ tcádu .i se mu'i bo la .teris. co'i cúxna lo ka ba cádzu ze'a le nícte ni'o ca le cérni la .teris. mo'u kláma le pa zárci noĭ se stúzi le kórbi be le tcádu .i le pa nánla cu zváti le stúzi .i lu .ĭi caĭ tírxu li'u se cúsku le bi'u naĭ nánla .i lu .ĭi caĭ nánla li'u se cúsku la .teris. to .i le bi'u naĭ nánla fa'u la .teris. pu no roĭ zgána lo tírxu fa'u lo nánla toĭ .i le nánla noĭ se cméne [zo .mulis.] goĭ my gánse le nu la .teris. na brádi .i se ki'u bo préti fi le nánla fe le nu la .teris. cu djíca le nu ri gaŭ my se slábu le tcádu .i lu .ĭe saĭ .i ku'i ca je'a se djíca mi fa lo nu mi ze'a sípna .i mi mútce le ka tátpi li'u se cúsku la .teris. .i lu je'e do .i mi'o zífre le ka kláma le zdáni be mi li'u se cúsku la .mulis. .i se ki'u bo le re meĭ cu cádzu kláma le zdáni be la .mulis. ni'o ca le nu le re meĭ mo'u kláma le zdáni vaŭ la .mulis. cu rétsku fi le mámta be ri fe lu gaŭ mi .e'o .e'a peĭ le tírxu cu kánsa mi le ka kláma le zdáni li'u .i lu .e'a doĭ la .mulis. li'u se cúsku le mámta .i ki'u bo ri jínvi le du'u la .mulis. cu xálbo .i se ja'e ku gaŭ la .mulis. zváti fa la .teris. le kúmfa ne my .i je la .teris. co'a sípna ga'u je re'o le lóldi .i ca bo la .mulis. cu zúkte le ka kláma le bártu vaŭ le nu my kélci ni'o le mámta za kríxa cúsku lu doĭ la .mulis. ca tcíka le nu vánci sánmi .i ju'i la .mulis. li'u .i le mámta cu kláma le kúmfa pe la .mulis. gi'e víska la .teris. ca le nu ri sípna .i le mámta co'a kríxa cúsku lu .ĭi caĭ le tírxu co'i cítka le bérsa be mi .i doĭ púlji ko sídju .i ko sídju .i doĭ púlji .i tírxu .i tírxu .i ko sídju li'u gi'e to'o bájra .i le sávru cu múkti le ka co'a cíkna vaŭ la .teris. .i ri plípe pa'o le cánko gi'e bájra kláma le zdáni be le neĭ beĭ ne'i le fóldi be loĭ spáti gi'e núpre fi le neĭ fe le ka no roĭ ba clíva le bi'u naĭ fóldi)"
