id = "cll.8.42.c8e4d5"
lojban = "mi ba citka le dembi pe mi zi'e poi cpana le mi palta zi'e noi do dunda ke'a mi"
translation-en = "I'll eat my beans that are on my plate, the ones you gave me."
gloss-en = "I [future] eat the beans associated-with me and which are-upon"

