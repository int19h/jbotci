lojban = "ganai da'inai do viska le mi citno mensi gi ju'o do djuno le du'u ri pazvau"
translation-en = "If you saw my younger sister, you would certainly know she is pregnant."
gloss-en = "If [factual] you see the of-me young sister, … then [certainty] you know the predication-of she is-pregnant."

