id = "cll.16.102.c16e12d9"
lojban = "ganai la djein. le zarci cu dzukla ginai la djein. le zarci cu bajrykla"
translation-en = "If Jane walks to the market, then she doesn't run."
gloss-en = """
If that-named Jane to-the market - walks,
… then-([false] that-named Jane to-the market - runs)."""

