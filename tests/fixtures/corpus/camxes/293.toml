id = "corpus.camxes.293"
lojban = "le'u bu co bu"

[[provenance]]
kind = "corpus"
corpus = "camxes"
entry-id = "293"
# The surviving unopened LEhU is a morphology fault. Its diagnostic keeps the original word span and message.
# BU keeps the fault in its base. Reference analysis requires valid morphology.

[expectations.morphology]
status = "failure"
diagnostics = [{ severity = "error", code = "morphology.unopened-quote", byte-span = [0, 4], source-text = "le'u", message = "unexpected cmavo" }]

[expectations.syntax]
status = "failure"
diagnostics = [{ severity = "error", code = "morphology.unopened-quote", byte-span = [0, 4], source-text = "le'u", message = "unexpected cmavo" }]

[expectations.semantics.refs]
status = "failure"
error = "morphology error: unexpected cmavo at character 0: `le'u`"
