id = "muplis.18.1815.canonical"
lojban = """
ju'a nai cy pa nu bu'u cy no zo'u do tadni kei
.i cy no ke drata gugde ke'e
.i ma goi ko'a zo'u do djica cy pa ko'a"""
translation-en = "Why do you want to study abroad?"

