id = "muplis.18.1706.canonical"
lojban = """
ju'a nai cy pa najnimre
.i ju'a nai ro da zo'u ge li ma'o fyno mo'e da lo'o me da me'u gi li ma'o fyno mo'e da lo'o za'u mei
.i xu kau su'o da zo'u li ma'o fyno mo'e da lo'o nelci cy pa"""
translation-en = "Do they like oranges?"

