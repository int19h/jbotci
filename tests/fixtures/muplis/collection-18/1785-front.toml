id = "muplis.18.1785.front"
lojban = "le noi se kerfa lo clani sloska ku'o kriceto be la'o ly. Teddy Bear .ly. dalpe'o be ra pu se cmene zoi gy.Jabberwocky.gy."
translation-en = "His long-haired, blond, Teddy Bear hamster was called Jabberwocky."

