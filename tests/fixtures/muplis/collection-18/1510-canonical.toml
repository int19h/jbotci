id = "muplis.18.1510.canonical"
lojban = """
cy re ka ce'u djica cy pa kei
.i ju'a nai cy pa nu za'u re'u ku zo'u mi viska cy no kei
.i ju'a nai cy no nanmu
.i mi no va'e cy re"""
translation-en = "I have no wish to see the man again."

[[provenance]]
kind = "muplis"
collection-id = "18"
item-id = "1510"
form = "canonical"
url = "https://lensisku.lojban.org/en/collections/18"

