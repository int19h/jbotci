id = "muplis.18.1800.canonical"
lojban = """
ju'a nai cy pa nei
.i ju'a nai cy no prenu
.i na'o ku ro da poi cy pa nupre ke'a ku'o zo'u cy no zukte da"""
translation-en = "He is a man of his word."

