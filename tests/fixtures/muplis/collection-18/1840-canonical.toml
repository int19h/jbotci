id = "muplis.18.1840.canonical"
lojban = """
cy no djedi li za'u re boi lo'o
.i ze'a cy no zo'u na ku la alis. zvati
.i la'e di'u lu'u cizra"""
translation-en = "Alice isn't present for more than two days. That is strange."

