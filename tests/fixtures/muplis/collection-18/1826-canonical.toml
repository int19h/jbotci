id = "muplis.18.1826.canonical"
lojban = """
cy pa ka gau ce'u zo'u cy no porpi kei
.i ju'a nai ge cy no kokso gi cy no pa mei
.i xu kau zo'u do kakne cy pa"""
translation-en = "Can you crack the coconut?"

