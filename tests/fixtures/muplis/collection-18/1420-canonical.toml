id = "muplis.18.1420.canonical"
lojban = """
ju'a nai ro da zo'u li ma'o fyno mo'e da lo'o nu vecnu da do kei
.i ma goi ko'a zo'u ko'a poi'i do djica li ma'o fyno mo'e ce'u lo'o kei"""
