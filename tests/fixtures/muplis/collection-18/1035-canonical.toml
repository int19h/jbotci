id = "muplis.18.1035.canonical"
lojban = """
ge ju'a nai cy pa tricu gi cy pa me tu me'u
.i ju'a nai ge cy no cipni gi cy no pa mei
.i catlu ko
.i cy no nenri cy pa"""
translation-en = "Look! There's a bird in that tree."

