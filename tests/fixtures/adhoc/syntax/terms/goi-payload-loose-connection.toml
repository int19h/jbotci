[[provenance]]
kind = "other"
name = "epoch-6b #794 GOI payload witness"
description = "The loose (T3) tier of the normal-flavour payload, and its construct warning. camxes-exp reaches it through `term_1 <- term_2 (joik_ek term_2)*` under the GOI payload's `term` (camxes-exp.peg:142, :207) and rolling Zantufa through its own `term <- term_1 (joik_ek term_1)*` (zantufa-1.9999.peg:27, :43); camxes-standard REJECTS, because it has no term-level connective tier at any position, which is what makes the tier a diagnosed extension exactly like its `nonabs_term` and `linked_term` siblings. Re-probed against all three parsers. Rejected at the 6a base, whose payload had no connective tier at all."

