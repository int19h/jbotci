id = "adhoc.syntax.terms.zantufa-fa-joik-chain-selbri-boundary"
lojban = "fa je fe broda"
dialect = "(zantufa)"
tags = ["adhoc", "syntax", "issue-827", "term-hierarchy-epoch", "zantufa"]

[[provenance]]
kind = "other"
name = "epoch-6c #827 Zantufa term binding witness"
description = "The #827 chain arm still declines at the `!tanru_unit_1` guard, but since epoch 10's C-e (#831, 7a18ce022d) the Zantufa FA atom owns the whole chain inside the selbri, `(fa [je fe] bróda)` with one zantufa-fa-tanru-unit warning: Zantufa's own reading, which parses fa as an FA_clause in tanru_unit_1. Unlike #933's `mi fa broda`, which camxes-std accepts so that the baseline reading must win, camxes-std rejects `fa je fe broda`: there is no baseline parse to protect, and on the Zantufa axis the dialect's source reading wins. The default configuration still reads FA-as-tag, `([fa {je fe}] bróda)`, camxes-exp's reading."

