name = "epoch-6b #794 GOI payload witness"
description = "camxes-standard spells the GOI payload `nonabs_term` (camxes.peg:168, :128), whose FA-led alternative is a term arm of its own, so the payload is the shared `place_tagged_sumti_term` leaf. Probed: camxes-standard reads `FA_clause sumti` under `nonabs_term`, camxes-exp reads the same surface as a `tag_term` whose `tense_modal` is the FA, and rolling Zantufa reads a `tag_term`. Acceptance is unchanged from the 6a base; the tree and the diagnostics are not, because the narrow `relative_sumti` payload had no FA arm and routed the surface through the epoch-5 FA-as-tag extension instead."

