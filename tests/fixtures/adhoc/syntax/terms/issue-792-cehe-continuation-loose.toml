[[provenance]]
kind = "other"
name = "epoch-6 term hierarchy witness"
description = "The CEhE continuation takes the unguarded leaf inventory over the absorption-safe connection tiers, so a loose connection is reachable inside it (camxes-exp.peg:122). camxes-standard reads the continuation as a single nonabs_term and rejects. One of the four surfaces the epoch newly makes reachable through the T3 tier. The connection is an extension in every profile, so it carries ExperimentalTermLooseConnection (syntax.warning.experimental-term-loose-connection) on its `.e`, anchored on the continuation's first token by the construct-warning visitor rather than by an in-parser warn; #860 is superseded for T3."

