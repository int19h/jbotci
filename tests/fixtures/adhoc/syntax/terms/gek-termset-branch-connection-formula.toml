description = "The NUhI-less GEK termset lowers as a logical CONNECTION, not as a term: each branch is spliced into the surrounding sentence terms and the two resulting bridi are joined by the GEK/GIK pair. Branch membership follows the nesting: the leading operands read outermost-first are the branch before the GIK and the trailing operands read innermost-first are the branch behind it. Before the branch formula existed this surface reached the principled invalid_graph error 'non-sumti term reached sumti visible-place advancement'."

