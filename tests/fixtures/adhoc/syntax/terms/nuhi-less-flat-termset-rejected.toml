description = "The three sourced termset shapes are NUhI-gek, NUhI-plain and the NUhI-less `gek_termset`, and the last of those pairs its operands by nesting, one term per position (camxes.peg:136-138, camxes-exp.peg:191-193). An unbalanced NUhI-less run therefore has no sourced reading at all: camxes-standard and camxes-exp both reject this surface, and so does jbotci once `forethought_termset` is NUhI-mandatory. The optional-NUhI node this replaces used to accept it with a flat branch shape no parser produces."

