description = "The PEhE operand is the CEhE level, which composes over the loose tier (camxes-exp.peg:121), so a loose connection is reachable inside a PEhE operand. camxes-standard gives the PEhE level terms_2 operands with no connective tier and rejects. One of the four surfaces the epoch newly accepts warning-free through the T3 tier; the missing diagnostic is the documented gap owned by #860."

