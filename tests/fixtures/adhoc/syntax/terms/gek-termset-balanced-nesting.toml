id = "adhoc.syntax.terms.gek-termset-balanced-nesting"
lojban = "ge pu ko'a pu ko'e gi pu ko'i pu ko'u broda"
tags = ["adhoc", "syntax", "issue-806", "term-hierarchy-epoch"]

[[provenance]]
kind = "other"
name = "epoch-6b #806 termset witness"
description = "`terms_gik_terms <- nonabs_term (gik / terms_gik_terms) nonabs_term` pairs operands by NESTING, not by concatenation: each level contributes one operand before its centre and one after it, so four operands nest as A (B gik C) D and the outermost operands are the outermost pair. The GIK alternative is listed before the recursive one, exactly as upstream orders it, so the innermost pair is the one that finds the GIK. jbotci read this as a flat 2 + 2 before the epoch; no upstream parser produces that shape."

