[[provenance]]
kind = "other"
name = "epoch-6b #794 GOI payload witness"
description = "`NA KU` is a leaf of the shared term inventory rather than a payload-only arm: camxes-standard reads `NA_clause KU_clause` under `nonabs_term` (camxes.peg:168) and camxes-exp reads the third alternative of `tag_term` (camxes-exp.peg:149). All three profiles accept. `NA KU` carries no sumti for the `goi` assignment to read, so the clause takes the v4-K route every unreadable association payload takes and lowers as a negated relative phrase carrying the unlowered-GOI-marker diagnostic — the same graph `ko'a po na ku broda` builds, modulo the relation name. It did NOT lower at all before this epoch's round-2 fix: the `goi` arm returned early and the clause vanished from the graph."

