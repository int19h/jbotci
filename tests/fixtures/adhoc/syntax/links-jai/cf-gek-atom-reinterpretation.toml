description = "#834 positive row: a leading ga...gi that Zantufa reads as a GEK atom inside the linked level-2 selbri. Reference: Zantufa 1.9999 accepts through selbri_1's KEhE-linked alternative; camxes (ilmentufa -std) rejects; camxes-exp (ilmentufa -exp) rejects. Explicit ZantufaSelbri plus ZantufaSelbriReinterpretation. Known gap #933: with the reinterpretation flag on, Zantufa's reading (ga broda gi brode linked) should win; the current result keeps the baseline-first reading and is pinned as-is pending #933."

