description = "ZR-J6: a proven JAI marker whose nested inner child is unproven -- the enclosed GEK's branch operand is a bare me with a synthesized mandatory sumti -- with the surviving owner under a Prefix containing field. Trace candidate=priority-selbri wrapper=valid answer=Unproven decision=reject. Pairs with ce-zr-j5, whose identical fail-closed rejection sits under Valid containing fields. Reaching this row at all takes both halves at once, which is why it was the last one pinned: the in-candidate damage that produces Unproven normally leaves the survivor on an all-Valid chain, and the separate skipped ku that confers the Prefix normally stops the classifier being re-entered on the first statement. Here the first statement fails on its own, so recovery re-parses it and both observations hold together. Minimal explicit axis, where ZantufaSelbri alone does not enable the JAI tag-term route, so the priority classifier is never reached and recovery skips the region rather than re-owning it."

