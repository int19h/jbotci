description = "GR-S6 is a negative reachability obligation resolved by construction, and this is its nearest honest end-to-end pin. The frozen row asks for a complete standalone candidate with NAI-bearing or non-Zantufa inventory answering Absent. No parse can build one: the atom GEK has no NAI field anywhere -- the branch rule is commented in the grammar as the exact GI branch, not the NAI-bearing GIK -- and recovered_standalone_presence has no inventory-driven Absent arm either, all its Absent outcomes coming from the ownership and reservation rules. This fixture is therefore an explicitly labelled CONTROL, not the row's witness: it demonstrates that a real standalone Absent ownership route exists and rejects with the prior owner keeping the extent, using the JOIK overlap rule. It does NOT witness the NAI-bearing or inventory-contradicting condition the row names, which the model cannot represent at all; that condition is resolved by the construction proof above. Minimal explicit axis, where the answer is Present instead: with no baseline competitor for this opener the JOIK key is source-only, so the atom is admitted. The pair shows the Absent on the built-in axis is the overlap rule at work, not a missing inventory check."

