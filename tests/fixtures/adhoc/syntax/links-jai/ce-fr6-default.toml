description = "FR6: the same nested-uncertainty rejection as ce-fr5, but under a Prefix containing field. Trace candidate=fa wrapper=valid answer=Unproven decision=reject, and the winning tree confers Prefix on the field holding the surviving structure at that position together with the synthesized sumti as an Error. A Prefix containing field is not permission to admit an Unproven candidate: the FA atom is still absent. Default control: no C-e product exists on this axis, so the row's ownership question is never asked and the pre-existing parse stands."

