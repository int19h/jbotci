[[provenance]]
kind = "other"
name = "Epoch 10 C-f #834 KEhE-linked selbri reference row"
description = "#834 positive row: an atom-bearing tanru whose GEK unit follows a brivla. Reference: Zantufa 1.9999 accepts through selbri_1's KEhE-linked alternative; camxes (ilmentufa -std) rejects; camxes-exp (ilmentufa -exp) rejects. Explicit ZantufaSelbri plus ZantufaSelbriReinterpretation. A GEK unit after a brivla is the reinterpretation-gated reading (as for ce-gr-s9), so this is the minimal axis on which the row agrees with Zantufa."

