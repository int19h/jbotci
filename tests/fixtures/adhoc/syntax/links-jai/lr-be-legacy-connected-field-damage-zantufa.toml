description = "Individually dispositioned as a stale expectation, not a regression. The trailing `.i mi ku` of this input ends in a `ku` that has nothing to terminate: CLL 20.1 gives `ku` as the elidable terminator for LE and some LA descriptions, after a tense or modal to show no sumti follows, and in NA+KU, and a bare `mi` is none of those. The old expectation kept that `ku` as a valid token by synthesizing a zero-width missing required field, which is the parser inventing a description the grammar does not license; the current output skips it as invalid input instead, which is the fail-closed reading the epoch requires. Diagnostics are unchanged; only the valid-token list and that one recovery item move. This fixture was already red at the accepted head 75afada918 and was never re-measured after the C-e routing work, so the delta predates the grouped-sumti classifier."

