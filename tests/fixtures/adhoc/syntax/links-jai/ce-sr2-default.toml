description = "SR2 asks for a KE body with no parsed value to leave the grouped candidate Unproven and rejecting fail-closed. This fixture pins what the parser actually does, which does not satisfy that on every axis: grouped sumti is the one C-e product with no recovered evidence classifier of its own -- ownership is decided by the two strict_observe guards and the termset rejection -- so nothing refuses a grouped product whose mandatory body is a synthesized Error. Reported to the PM as an open fail-closed gap; the fixture is here so that a fix shows up as an expectation change rather than passing unnoticed. Default control: the region is skipped and no KE termset is claimed either."

