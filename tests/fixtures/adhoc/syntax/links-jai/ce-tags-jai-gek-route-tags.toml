name = "Epoch 10 C-e #831 frozen recovered row JAI guard control: enclosed GEK route"
description = "Legitimate tags route that the JAI term-start reservation exists to protect. The reservation must still run BEFORE the JAI is consumed, or `jai ga ...` steals the enclosed selbri as a tag term plus gek sumti; the fix only adds this rule's own mandatory JAI as a cheap discriminator in front of it, so this ownership is unchanged. Minimal explicit axis with ZantufaTags alone: without ZantufaSelbri there is no atom family, so the JAI tag term owns the extent instead of the enclosed forethought tanru unit. Both axes parse cleanly, which is the point -- the reservation fix narrows neither."

