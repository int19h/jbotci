name = "Epoch 10 C-e #831 frozen recovered row ZR-J6"
description = "ZR-J6: a proven JAI marker whose nested inner child is unproven -- the enclosed GEK's branch operand is a bare me with a synthesized mandatory sumti -- with the surviving owner under a Prefix containing field. Trace candidate=priority-selbri wrapper=valid answer=Unproven decision=reject. Pairs with ce-zr-j5, whose identical fail-closed rejection sits under Valid containing fields. Reaching this row at all takes both halves at once, which is why it was the last one pinned: the in-candidate damage that produces Unproven normally leaves the survivor on an all-Valid chain, and the separate skipped ku'o that confers the Prefix normally stops the classifier being re-entered on the first statement. Here the first statement fails on its own, so recovery re-parses it and both observations hold together. Default control: no C-e product exists on this axis, so the row's ownership question is never asked. Trailing damage changed in epoch-10 C-g from `ku` to `ku'o` together with the -zantufa row, so every axis of this family pins one input: on the -zantufa axis main's recovery keeps a bare `ku` behind a synthesized sumti (#934), and a stray `ku'o` is skipped on every axis."

