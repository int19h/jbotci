name = "Epoch 10 C-e #831 frozen recovered row ZR-S6"
description = "ZR-S6: the same nested-uncertainty priority rejection as ce-zr-s5, with the surviving owner under a Prefix containing field. Trace candidate=priority-selbri wrapper=valid answer=Unproven decision=reject. Shares its input with ce-gr-e7, which pins the enclosed classifier's own answer on the same parse, exactly as ce-zr-s5 shares with ce-gr-e6; the two rows pin different classifiers, not the same observation twice. Minimal explicit axis, where the priority wrapper is not reached, as in ce-zr-s5-selbri. Trailing damage changed in epoch-10 C-g from `ku` to `ku'o` together with the -zantufa row, so every axis of this family pins one input: on the -zantufa axis main's recovery keeps a bare `ku` behind a synthesized sumti (#934), and a stray `ku'o` is skipped on every axis."

