name = "Epoch 10 C-e #831 frozen recovered row SR2"
description = "SR2: no parsed value proves KE body ownership, so the grouped candidate answers Unproven and rejects fail-closed. Trace candidate=grouped-sumti wrapper=valid answer=Unproven decision=reject. This row previously pinned a real fail-open gap: grouped sumti was the one C-e product with no recovered evidence classifier of its own, so `ke ke'e` claimed the construct and reported its warning while its mandatory sumti was a synthesized Error covering no input. The classifier added alongside this fixture closes that, and the row now witnesses the behaviour the frozen table asks for. Minimal explicit axis, and the axis that previously exhibited the gap: the grouped candidate is now classified Unproven and rejects, so no ZantufaGroupedSumti owner and no grouped-sumti warning appear. Recovery on this axis no longer passes through the priority route's rejected attempt, because that route is feature-gated off without ZANTUFA-SELBRI, so `bróda` stays the selbri with the single `ke'e` error, and the grouped-bridi-tail warning that the absent route's failure record used to steer recovery into is gone."

