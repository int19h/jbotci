id = "adhoc.syntax.links-jai.ce-sr2-terms"
lojban = "ko'a ke ke'e broda"
dialect = "(+zantufa-terms)"
tags = ["adhoc", "syntax", "issue-831", "links-jai-epoch"]

[[provenance]]
kind = "other"
name = "Epoch 10 C-e #831 frozen recovered row SR2"
description = "SR2 asks for a KE body with no parsed value to leave the grouped candidate Unproven and rejecting fail-closed. This fixture pins what the parser actually does, which does not satisfy that on every axis: grouped sumti is the one C-e product with no recovered evidence classifier of its own -- ownership is decided by the two strict_observe guards and the termset rejection -- so nothing refuses a grouped product whose mandatory body is a synthesized Error. Reported to the PM as an open fail-closed gap; the fixture is here so that a fix shows up as an expectation change rather than passing unnoticed. Minimal explicit axis, and the witness for the gap: a ZantufaGroupedSumti owner wins with kehe parsed, the experimental grouped-sumti warning reported, and its mandatory sumti field a synthesized Error covering no input at all."

[expectations.syntax]
status = "failure"
diagnostics = [{ severity = "error", code = "syntax.unexpected-cmavo", byte-span = [8, 12], source-text = "ke'e", message = "unexpected cmavo" }]

