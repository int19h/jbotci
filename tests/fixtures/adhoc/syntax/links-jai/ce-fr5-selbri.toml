description = "FR5 pins a top-level Valid outer with an occupied, complete FA wrapper whose nested inner atom is unproven: the inner is a bare me whose mandatory sumti is a synthesized MissingRequiredField. Trace: candidate=fa wrapper=valid answer=Unproven decision=reject. The uncertainty is nested under a complete outer candidate, not damage to the FA or JOIK discriminators themselves. ZantufaSelbri alone does not enable the FA-as-tag term route that the built-in axis falls back to, so after the same fail-closed rejection recovery skips the whole FA region rather than re-owning it. The withdrawal is pinned as it actually happens, not as an assumed return to an earlier owner."

