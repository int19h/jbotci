description = "GR-S5 pins a top-level Valid standalone BINARY candidate WITH the route-level conjunction, at a tanru position where the baseline has no competing reading. Trace: candidate=standalone-gek wrapper=valid answer=Present decision=accept. Control on the built-in axis, which does not enable reinterpretation: the same complete BINARY candidate is classified Absent and rejects. With no atom and no baseline reading for a GEK in this tanru position, recovery then skips the whole statement, and the raw digest is byte-identical to the default axis. The pair isolates reinterpretation as the only difference between Absent and Present on a structurally identical product."

