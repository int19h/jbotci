name = "Epoch 10 C-e #831 frozen recovered row GR-S10"
description = "GR-S10: the same occupied-opener, unproven-branch standalone rejection as ce-gr-s7 -- the branch operand is a bare me with a synthesized mandatory sumti -- under a Prefix containing field rather than a Valid one. Trace candidate=standalone-gek wrapper=valid answer=Unproven decision=reject. The row requires the candidate to reject fail-closed, and nothing claims the extent afterwards; the Prefix on the containing paragraph field carries the separately skipped ku'o as its ordered recovery evidence. Default control: no C-e product exists on this axis, so the row's ownership question is never asked and the pre-existing parse stands. Trailing damage changed in epoch-10 C-g from `ku` to `ku'o` together with the -zantufa row, so every axis of this family pins one input: on the -zantufa axis main's recovery keeps a bare `ku` behind a synthesized sumti (#934), and a stray `ku'o` is skipped on every axis."

