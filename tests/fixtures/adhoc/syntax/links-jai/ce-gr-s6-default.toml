name = "Epoch 10 C-e #831 frozen recovered row GR-S6"
description = "GR-S6 is a negative reachability obligation resolved by construction, and this is its nearest honest end-to-end pin. The frozen row asks for a complete standalone candidate with NAI-bearing or non-Zantufa inventory answering Absent. No parse can build one: the atom GEK has no NAI field anywhere -- the branch rule is commented in the grammar as the exact GI branch, not the NAI-bearing GIK -- and recovered_standalone_presence has no inventory-driven Absent arm either, all its Absent outcomes coming from the ownership and reservation rules. This fixture is therefore an explicitly labelled CONTROL, not the row's witness: it demonstrates that a real standalone Absent ownership route exists and rejects with the prior owner keeping the extent, using the JOIK overlap rule. It does NOT witness the NAI-bearing or inventory-contradicting condition the row names, which the model cannot represent at all; that condition is resolved by the construction proof above. Default control: no C-e product exists on this axis, so the row's ownership question is never asked and the pre-existing parse stands."

