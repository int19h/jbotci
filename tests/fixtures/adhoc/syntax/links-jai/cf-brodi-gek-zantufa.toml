lojban = "mi brodi ga broda gi brode ke'e be ko'a be'o"
dialect = "(zantufa)"
tags = ["adhoc", "syntax", "issue-834", "links-jai-epoch"]

[[provenance]]
kind = "other"
name = "Epoch 10 C-f #834 KEhE-linked selbri reference row"
description = "#834 positive row: an atom-bearing tanru whose GEK unit follows a brivla. Reference: Zantufa 1.9999 accepts through selbri_1's KEhE-linked alternative; camxes (ilmentufa -std) rejects; camxes-exp (ilmentufa -exp) rejects. Built-in Zantufa axis. The built-in axis does not carry the reinterpretation flag, so the GEK unit after brodi is not read as a tanru unit (the base form fails the same way)."

