id = "adhoc.syntax.subsentence.d2-kuho-reservation-free-modifier"
lojban = "lo broda po'oi to do brodi toi mi brode ku'o cu brodi"
tags = ["adhoc", "syntax", "subsentence-epoch"]

[[provenance]]
kind = "other"
name = "epoch-8 subsentence ownership matrix witness"
description = "The KUhO reservation at the marker boundary. Zantufa's NOI_clause carries post-clause free modifiers, so the reservation's marker must consume them exactly as the owning arm's does; without that the reservation failed to parse, D2 took the shorter reading and the explicit ku'o was left with nowhere to attach."

