id = "adhoc.syntax.subsentence.d1-s3-free-modifier-before-nai-mixed-list"
lojban = "broda po'oi mi brode je to do brodi toi nai po'oi do brodi"
dialect = "(+zantufa-terms)"
tags = ["adhoc", "syntax", "subsentence-epoch"]

[[provenance]]
kind = "other"
name = "epoch-8 subsentence ownership matrix witness"
description = "The other half of the same class, and the one the S3 ownership classifier owns rather than the reservation. Every clause here is one camxes-exp's tanru-unit relative could form, so ExpSelbriRelativeListRejection used to return the list to that route on the strength of the clauses alone -- but since round 3 the chain refuses this connective, a free modifier before a present NAI, so the route would not take it and the surface was withdrawn from the epoch base. The classifier now tests the connective with the same predicate the chain's rejection uses, the list stays S3's, and the extent the base read is preserved."

