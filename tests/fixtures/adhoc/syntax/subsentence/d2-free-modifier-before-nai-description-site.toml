description = "The description-site form of the before-NAI placement: here the reservation rather than the S3 classifier keeps the surface, because the probe's joik arm spells opt(cmavo(Nai).wf()) after a head that already carries its own .wf(), which is exactly what exp_relative_clause_connective spells at this site. Pinned at both sites so a later narrowing of either cannot silently take one of them away."

