name = "epoch-8 subsentence ownership matrix witness"
description = "The GOI half of the same mixed-list class as d1-s3-leading-selbri-zihe-mixed-list: a relative clause can also begin with GOI (relative_clause_atom's sumti_association_relative_clause arm), so a ZIhE standing in front of pe strands the connective exactly as one in front of poi does. camxes-exp's selbri_relative_clause is NOhOI-only (:1907), so this list is not an extent that route can form either, and the reservation's marker inventory is therefore NOI union GOI rather than NOI alone. Round 3 shipped the NOI half only and this surface was a regression against the epoch base; round 4 repays it."

