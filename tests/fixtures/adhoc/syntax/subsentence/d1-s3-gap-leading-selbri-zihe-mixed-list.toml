[[provenance]]
kind = "other"
name = "epoch-8 subsentence ownership matrix witness"
description = "Documented gap, issue #877: zantufa_relative_selbri's leading_selbri is the level-2 selbri ladder, which contains exp_relative_tanru_unit, so D2 takes the first NOhOI clause as part of the leading selbri and selbri_relative_clause_list never sees the list. The class this loses is a list whose first clause camxes-exp can form but whose whole cannot -- here a po'oi clause ZIhE-joined to a baseline poi; the je-joined shape is the twin witness. An explicit ku'o on the first clause fires the D2 reservation and the list reaches S3 intact, which is the boundary. The fix is the second boundary ladder Delta 4 declined to build."

