name = "#982 camxes-exp form"
description = "camxes-exp (ilmentufa 778ea13) gives ([BRIDI: {SUMTI: KOhA:mi} {SELBRI: G:broda}] [I:i {BRIDI: <SUMTI: KOhA:mi> <SELBRI: (¹G:brode [JA:je {FIhO:fi'o <SELBRI: GOhA:go'i> FEhU:fe'u} KE:ke G:brodi KEhE:ke'e]¹)>}]). The jbotci tree has the same structure. The FIhO tag of the JA-led KE tanru continuation holds go'i, and the reference pass visits the tag, so go'i refers to the earlier bridi. JA before a tagged KE group warns experimental-ja-ke-tanru-connective."

