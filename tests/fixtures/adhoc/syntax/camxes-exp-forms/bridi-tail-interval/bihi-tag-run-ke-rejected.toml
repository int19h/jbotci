id = "adhoc.syntax.camxes-exp-forms.bridi-tail-interval.bihi-tag-run-ke-rejected"
lojban = "mi klama vau bi'i pu nai bau ke cadzu ke'e"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI: KOhA:mi] [{<SELBRI: G:klama> VAU:vau} {BIhI:bi'i <(¹PU:pu NAI:nai¹) BAI:bau> KE:ke <SELBRI: G:cadzu> KEhE:ke'e}]), with pu nai bau as one stag. The BIhI KE joint cannot take that stag, because jbotci's tag stops after pu nai. The flat interval joint is refused when the whole run reaches KE, so jbotci rejects the text instead of splitting pu nai off as a term before a BAI-tagged KE selbri, which camxes-exp never derives. Tag runs that jbotci cannot read are a camxes-exp-only difference."

