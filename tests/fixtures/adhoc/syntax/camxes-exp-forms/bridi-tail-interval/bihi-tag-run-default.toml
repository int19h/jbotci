id = "adhoc.syntax.camxes-exp-forms.bridi-tail-interval.bihi-tag-run-default"
lojban = "mi klama vau bi'i pu nai bau cadzu"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "Default reading: (mi [{kláma vaŭ} {bi'i ([pu naĭ] [baŭ cádzu])}]). jbotci's tag stops after pu nai, so pu nai is a term and bau tags the selbri after it, as main reads mi pu nai bau brode. The new joint decides only where the joint is, and its operand keeps that default reading. camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI: KOhA:mi] [{SELBRI: G:klama} VAU:vau] [BIhI:bi'i {SELBRI: <(¹PU:pu NAI:nai¹) BAI:bau> G:cadzu}]), which differs because camxes-exp reads pu nai bau as one tag and jbotci cannot (#980)."

