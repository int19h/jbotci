id = "adhoc.syntax.camxes-exp-forms.na-joik.free-modifier-before-joi-na-joik"
lojban = "ko'a na sei brodi se'u joi ko'e broda"
dialect = "(+na-joik)"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "A free modifier stands between NA and JOI. camxes-exp's NA_clause takes no free modifier, so na sei brodi se'u is a bare NA term and joi alone joins the next sumti. With the na-joik feature the reading stays the default one, ([ko'a {(na [seĭ bródi se'u]) (joĭ ko'e)}] bróda), because the feature's guard and connective take NA and JOI only when they are adjacent. camxes-exp (ilmentufa 778ea13) gives (BRIDI: [{SUMTI: KOhA:ko'a} {<NA:na (¹SEI:sei [SELBRI: G:brodi] SEhU:se'u¹)> <JOI:joi (¹SUMTI: KOhA:ko'e¹)>}] [SELBRI: G:broda])."

