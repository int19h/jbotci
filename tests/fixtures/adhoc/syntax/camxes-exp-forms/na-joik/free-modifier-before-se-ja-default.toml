id = "adhoc.syntax.camxes-exp-forms.na-joik.free-modifier-before-se-ja-default"
lojban = "mi broda na sei brodi se'u se je pu brode"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "A free modifier stands between NA and SE JA. camxes-exp's NA_clause takes no free modifier, so na sei brodi se'u is a bare NA term and se je is the bridi-tail joint. Default reading, without the na-joik feature: (mi [{bróda (na [seĭ bródi se'u])} {(se je) (pu bróde)}])."

