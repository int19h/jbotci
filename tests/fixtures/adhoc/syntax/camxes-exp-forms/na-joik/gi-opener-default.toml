[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "Default reading, without the na-joik feature: (na [{joĭ gi} bróda {gi bróde}]). The default grammar reads the text as a NegatedForethoughtBridiConnection: na negates a forethought bridi connection whose opener is joi gi. The na-joik twin gives camxes-exp's reading, (BRIDI: [{<NA:na JOI:joi> GI:gi} {BRIDI: <SELBRI: G:broda>} GI:gi {BRIDI: <SELBRI: G:brode>}])."

