name = "#982 camxes-exp form"
description = "Without the na-joik feature, jbotci rejects this text, because the default grammar has no NA before JOI here. The na-joik twin gives camxes-exp's reading, ([NA:na JOI:joi] [I:i {BRIDI: <SELBRI: G:broda>}])."

