[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "With the na-joik dialect feature, NA SE? JOI NAI? is one connective, as in camxes-exp's merged joik (camxes-exp.peg:347), and the bare NA term refuses to start at it (:160). camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI {KOhA:ko'a <(¹NA:na JOI:joi¹) KE:ke (¹SUMTI: KOhA:ko'e¹) KEhE:ke'e>}] [SELBRI: G:broda]). The jbotci tree has the same structure. NA before JOI warns experimental-na-joi-connective."

