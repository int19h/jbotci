[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "With the mex-quantifier dialect feature, jbotci accepts this text, but camxes-exp (ilmentufa 778ea13) rejects this text. The cause is BIhE: jbotci's mex keeps CLL's mex-2 BIhE operator mex-1, but camxes-exp's mex_1 has BO in that place and has no BIhE (camxes-exp.peg:280). #980 records the difference. Without the feature, jbotci rejects this text (corpus fixture camxes/1708)."

