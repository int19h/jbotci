id = "adhoc.syntax.camxes-exp-forms.bridi-tail-ja-joi.ja-tag-run-ke-default"
lojban = "mi broda je pu nai bau ke brode ke'e"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "Default reading: (mi [bróda {je ([pu naĭ] [baŭ {ke bróde ke'e}])}]). jbotci's tag stops after pu nai, so pu nai is a term and bau tags the selbri after it, as main reads mi pu nai bau brode. The new joint decides only where the joint is, and its operand keeps that default reading. camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI: KOhA:mi] [SELBRI: {G:broda <JA:je (¹[PU:pu NAI:nai] BAI:bau¹) KE:ke G:brode KEhE:ke'e>}]), which differs because camxes-exp reads pu nai bau as one tag and jbotci cannot (#980)."

