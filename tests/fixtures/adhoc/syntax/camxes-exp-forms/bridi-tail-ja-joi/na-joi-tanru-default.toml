lojban = "mi broda na joi brode"
tags = ["camxes-exp-readd"]

[[provenance]]
kind = "other"
name = "#982 camxes-exp form"
description = "Default reading: (mi [{bróda na} {joĭ bróde}]). jbotci's default reads na before joi as a bare NA term at every term site, as main reads ko'a na joi ko'e broda, so here a bare NA term ends the first bridi tail and joi is the camxes-exp bridi-tail joint, which warns experimental-jacu-bridi-tail-connective. That composes individually sourced pieces (#887). camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI: KOhA:mi] [SELBRI: {G:broda <(¹NA:na JOI:joi¹) G:brode>}]): its merged joik reads na joi as one connective, and its bare NA term refuses to start at a joik_jek. That reading comes with the na-joik dialect flag (#982 group 3)."

