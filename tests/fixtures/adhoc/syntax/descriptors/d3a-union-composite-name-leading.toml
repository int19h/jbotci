description = "R/R/R at all three references, ACCEPTED here and warned as the camxes-exp route. The extent is an emergent composite of two individually sourced components: camxes-standard gives jbotci the name-leading sumti_6 (lo la djan mlatu cu blabi is std A / exp R / zan R and was already accepted at the base), and camxes-exp arm 3 lifts the leading position to a connection-level sumti. No single parser holds both, so no single parser accepts the composite. The acceptance is purely additive -- no baseline parse is reinterpreted and no extent is stolen -- and narrowing it would need an unsourced structural restriction, which the epic's own doctrine refuses."

