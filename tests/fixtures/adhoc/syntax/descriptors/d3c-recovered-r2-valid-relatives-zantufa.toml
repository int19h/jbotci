description = "A recovered with-relatives quantifier candidate whose relative list is Valid down to a PARSED opening marker. Entry evidence succeeds and the with-relatives variant keeps Zantufa ownership. The recovered spine intentionally carries no generated construct warning: plan-v7 D3c B8 froze that generation out of scope, #891 tracks the follow-up, and the strict-spine witness pins the warning. Current pin (epoch-10 C-g): a known recovery regression, tracked in #935. C-e's added checkpoints displace the winning descriptor_with_outer_quantifier_sumti candidate past the exact-phase trial budget (position 41 of the final list; the budget is 8), so it is tried only in the natural-stop phase, where it succeeds without firing left of the declared failure, and the driver discards such a late natural-stop success at the first error. The text therefore degrades to a total collapse, and the ownership described above is not currently observable. The epoch-10 base recovered it as (tírna [{re (poĭ cmálu)} ‼‼])."

