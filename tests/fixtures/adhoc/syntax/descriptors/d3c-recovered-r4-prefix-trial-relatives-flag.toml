description = "An intermediate, globally unsuccessful FINAL recovery trial for this surface builds a with-relatives candidate whose relative_clauses slot is Prefix over a parsed opener. Its trace records `slot=prefix entry=parsed-opener started=yes decision=accept`: R4 counts that started Prefix as PRESENT and keeps Zantufa ownership at the classifier. The fixture digest instead pins the winning recovered tree, where Prefix is on outer_quantifier and the nested relative_clauses slot is Valid. The recorded 12,668-surface bounded search found no winning-tree R4 surface; this is a measured-bounded deviation from F4, not an impossibility claim (`~/git/grammar-review/reports/implementation/epoch-09-descriptions/reviews/pr-r5-r4-winning-prefix-search.md`). The recovered spine intentionally carries no generated construct warning: plan-v7 D3c B8 froze that generation out of scope and #891 tracks the follow-up. The dialect and the bare flag are two code paths and #634 requires both to be witnessed. Current pin (epoch-10 C-g): a known recovery regression, tracked in #935. C-e's added checkpoints displace the winning descriptor_with_outer_quantifier_sumti candidate past the exact-phase trial budget (position 31 of the final list; the budget is 8), so it is tried only in the natural-stop phase, where it succeeds without firing left of the declared failure, and the driver discards such a late natural-stop success at the first error. A second natural-stop success, which does fire left of the failure, still recovers it, but coarsely: (tírna ‼re poi cmalu kei‼), without the with-relatives candidate described above. The epoch-10 base recovered it as (tírna [{(re [poĭ cmálu]) ‼kei‼} ‼‼])."

