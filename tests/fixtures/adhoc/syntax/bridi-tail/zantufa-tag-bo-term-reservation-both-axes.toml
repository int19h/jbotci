id = "adhoc.syntax.bridi-tail.zantufa-tag-bo-term-reservation-both-axes"
lojban = "pu bo ko'a broda"
dialect = "(+zantufa-connectives +zantufa-terms)"
tags = ["adhoc", "syntax", "bridi-tail-epoch", "zantufa"]

[[provenance]]
kind = "other"
name = "epoch-7 bridi-tail ownership matrix witness"
description = "D3-2 round 3: the term-level consequence of the `!BO` reservation. Rolling Zantufa rejects this surface, because the same `!BO` in `tag_term` (zantufa-1.9999.peg:31) that makes the tail joint reachable also stops `pu` from being a term with an elided KU before a BO. Epoch 6c's connectorless term-level BO arm reached it, so the reservation removes that reading wherever ZANTUFA-CONNECTIVES is on -- which is where the parity gain is, and where the flip is measured. Dialect axis row 2 of 4: both axes, the same rejection for the same reason."

[expectations.syntax]
status = "failure"
diagnostics = [{ severity = "error", code = "syntax.unexpected-cmavo", byte-span = [3, 5], source-text = "bo", message = "unexpected cmavo" }]
