id = "adhoc.syntax.bridi-tail.zantufa-tag-bo-term-reservation-terms-axis"
lojban = "pu bo ko'a broda"
dialect = "(+zantufa-terms)"
tags = ["adhoc", "syntax", "bridi-tail-epoch", "zantufa"]

[[provenance]]
kind = "other"
name = "epoch-7 bridi-tail ownership matrix witness"
description = "D3-2 round 3: the term-level consequence of the `!BO` reservation. Rolling Zantufa rejects this surface, because the same `!BO` in `tag_term` (zantufa-1.9999.peg:31) that makes the tail joint reachable also stops `pu` from being a term with an elided KU before a BO. Epoch 6c's connectorless term-level BO arm reached it, so the reservation removes that reading wherever ZANTUFA-CONNECTIVES or ZANTUFA-TERMS is on -- round 4 widened the gate from the connectives axis alone, because ZANTUFA-TERMS is the feature that enables the 6c arm and a Zantufa projection must not preserve a defect all three references reject. Dialect axis row 3 of 4: the terms axis alone, which round 4 flipped from epoch 6c's wider reading to the same rejection the other three rows pin. The gate is now inert only when both axes are off, which is the one configuration with no Zantufa arm behind the reservation."

[expectations.syntax]
status = "failure"
diagnostics = [{ severity = "error", code = "syntax.unexpected-cmavo", byte-span = [3, 5], source-text = "bo", message = "unexpected cmavo" }]
