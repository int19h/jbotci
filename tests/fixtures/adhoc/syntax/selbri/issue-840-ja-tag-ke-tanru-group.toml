description = "JA, a tag and a KE group after a selbri. camxes-exp's merged joik admits JA in the selbri level-4 KE continuation, so the whole is a tanru, not a bridi-tail joint; #982 follows it, with experimental-ja-ke-tanru-connective. camxes-exp (ilmentufa 778ea13) gives (BRIDI: [SUMTI: KOhA:mi] [SELBRI: {G:broda <JA:je PU:pu KE:ke G:brode KEhE:ke'e>}]). The jbotci tree has the same structure."

