name = "K3 description-position extension reach"
description = "The description-boundary selbri keeps a baseline-shaped CEI prefix inside one nested Zantufa candidate when a later assignment has an NA-led operand."

[[provenance]]
kind = "other"
name = "running parser confirmation"
description = "The running standard and experimental camxes parsers reject at KU; the running Zantufa 1.9999 parser accepts and nests the second CEI assignment inside the first operand."

