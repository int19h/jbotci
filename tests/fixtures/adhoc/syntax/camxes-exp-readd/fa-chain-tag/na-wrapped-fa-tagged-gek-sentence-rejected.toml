description = "camxes-exp (ilmentufa 778ea13) rejects this text. camxes-exp's abs_tag_term refuses the FA chain here through !gek_sentence, because NA wraps a gek_sentence whose KE carries the tag fa (camxes-exp.peg:112, :160). With the chain refused, camxes-exp has no other reading. jbotci's guard keeps FA tags in its recursive NA and KE arms, so it refuses the split into the chain fa je fe, a NA term, a plain FA term and a KE bridi tail."

