[[provenance]]
kind = "other"
name = "#969 camxes-exp re-add"
description = "camxes-exp (ilmentufa 778ea13) gives (BRIDI: [{FA:fa <BIhI:bi'i FA:fe>} {SUMTI: KOhA:ko'a}] [SELBRI: G:broda]). The jbotci tree has the same structure. A simple interval between the FA tags. Before #969 jbotci read this text as a connected term: two PlaceTaggedSumtiTerm operands, fa with an elided KU and fe ko'a, with the interval between them, under the experimental-term-loose-connection warning. camxes-exp reads it as one JOIK-chained FA tag, and the camxes-exp tree wins, so the FA chain takes the text."

