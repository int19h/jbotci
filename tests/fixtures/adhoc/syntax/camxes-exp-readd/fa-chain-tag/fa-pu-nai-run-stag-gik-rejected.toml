description = "camxes-exp (ilmentufa 778ea13) gives (BRIDI: [{<FA:fa (¹JA:je [FA:fe FA:fa {PU:pu NAI:nai}]¹)> GI:gi} {BRIDI: <SELBRI: G:broda>} GI:gi {BRIDI: <SELBRI: G:brode>}]), one forethought sentence opened by FA-tagged tags, a camxes-exp-only form (#980). The run after je is fe, fa and pu nai. The guard reads each atom on its own, baseline tenses first, so pu nai keeps its NAI after the FA atom. Both guards then recognize the GEK opener and refuse the FA chain with an elided KU. Without them the bridi would take the chain, a plain FA term and a pu nai gi forethought tail."

