id = "adhoc.v0.morphology.basic.su-erases-to-previous-niho"
lojban = "mi klama ni'o do cadzu su broda"
tags = ["v0-adhoc", "morphology"]

[expectations.morphology]
status = "success"
raw = """[PlainWord(Cmavo { phonemes: Phonemes { text: "mi" }, span: SourceSpan { source_id: Some(SourceId("<fixture>")), byte_start: 0, byte_end: 2, char_start: 0, char_end: 2, start: None, end: None } }), PlainWord(Gismu { phonemes: Phonemes { text: "kláma" }, span: SourceSpan { source_id: Some(SourceId("<fixture>")), byte_start: 3, byte_end: 8, char_start: 3, char_end: 8, start: None, end: None } }), PlainWord(Cmavo { phonemes: Phonemes { text: "ni'o" }, span: SourceSpan { source_id: Some(SourceId("<fixture>")), byte_start: 9, byte_end: 13, char_start: 9, char_end: 13, start: None, end: None } }), PlainWord(Gismu { phonemes: Phonemes { text: "bróda" }, span: SourceSpan { source_id: Some(SourceId("<fixture>")), byte_start: 26, byte_end: 31, char_start: 26, char_end: 31, start: None, end: None } })]"""

[expectations.output.vlasei]
brackets = "(mi kláma ni'o bróda)"
tree = """
[
  Cmavo @[0‥2) "mi",
  Gismu @[3‥8) "kláma",
  Cmavo @[9‥13) "ni'o",
  Gismu @[26‥31) "bróda",
]"""
json = """[{"PlainWord":{"Cmavo":{"phonemes":"mi","span":[0,2]}}},{"PlainWord":{"Gismu":{"phonemes":"kláma","span":[3,8]}}},{"PlainWord":{"Cmavo":{"phonemes":"ni'o","span":[9,13]}}},{"PlainWord":{"Gismu":{"phonemes":"bróda","span":[26,31]}}}]"""
