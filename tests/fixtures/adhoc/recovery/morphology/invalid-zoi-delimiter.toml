id = "adhoc.recovery.morphology.invalid-zoi-delimiter"
lojban = "zoi @@@ foo @@@"
tags = ["adhoc", "recovery", "morphology"]

[expectations.morphology]
status = "failure"
diagnostics = [{ severity = "error", code = "morphology.invalid-character", byte-span = [4, 5], source-text = "@", message = "invalid character in Lojban word" }]

[expectations.morphology.recovered]
status = "failure"
diagnostics = [{ severity = "error", code = "morphology.invalid-character", byte-span = [4, 5], source-text = "@", message = "invalid character in Lojban word" }, { severity = "error", code = "morphology.vowel-hiatus", byte-span = [9, 11], source-text = "oo", message = "vowels in hiatus are not allowed" }, { severity = "error", code = "morphology.invalid-character", byte-span = [12, 13], source-text = "@", message = "invalid character in Lojban word" }]
