name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-release-tool:
    name: CLI release tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run release tooling tests
        run: python3 -m unittest tools.tests.test_cli_release tools.tests.test_prepare_cli_release_workflow tools.tests.test_release_draft_script -v

  cargo-test:
    name: Cargo tests
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    env:
      DIOXUS_CLI_VERSION: 0.7.9
      CARGO_HOME: ${{ github.workspace }}/.github-cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.github-cache/cargo-target/test
      DIOXUS_HOME: ${{ github.workspace }}/.github-cache/home
      DIOXUS_CLI_ROOT: ${{ github.workspace }}/.github-cache/dioxus-cli/0.7.9
      DIOXUS_CLI_TARGET_DIR: ${{ github.workspace }}/.github-cache/cargo-target/dioxus-cli-0.7.9
      NODE_VERSION: 24.14.0
      CARGO_BUILD_JOBS: 4
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake curl git libclang-dev pkg-config python3.11-dev zstd
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Capture Rust version
        id: rustc
        run: |
          rustc_version="$(rustc --version | sed 's/[^A-Za-z0-9._-]/_/g')"
          echo "version=${rustc_version}" >> "${GITHUB_OUTPUT}"
          echo "Rust cache version: ${rustc_version}"

      - name: Restore cargo home cache
        id: cargo-home-cache
        uses: actions/cache/restore@v5
        with:
          path: .github-cache/cargo
          key: jbotci-cargo-home-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            jbotci-cargo-home-${{ runner.os }}-

      - name: Restore Dioxus CLI cache
        id: dioxus-cli-cache
        uses: actions/cache/restore@v5
        with:
          path: .github-cache/dioxus-cli/${{ env.DIOXUS_CLI_VERSION }}
          key: jbotci-dx-${{ runner.os }}-${{ env.DIOXUS_CLI_VERSION }}-${{ steps.rustc.outputs.version }}

      - name: Restore test target cache
        id: target-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .github-cache/cargo-target/test
            .github-cache/home/.dx
          key: jbotci-test-target-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            jbotci-test-target-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            jbotci-test-target-${{ runner.os }}-${{ steps.rustc.outputs.version }}-

      - name: Normalize test target cache mtimes
        uses: ./.github/actions/cargo-cache-mtimes
        with:
          mode: restore
          target-dir: .github-cache/cargo-target/test

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dioxus CLI
        env:
          HOME: ${{ env.DIOXUS_HOME }}
        run: |
          mkdir -p "${DIOXUS_HOME}" "${DIOXUS_CLI_ROOT}" "${DIOXUS_CLI_TARGET_DIR}"
          if ! "${DIOXUS_CLI_ROOT}/bin/dx" --version | grep -Eq "^dioxus ${DIOXUS_CLI_VERSION}( |$)"; then
            CARGO_TARGET_DIR="${DIOXUS_CLI_TARGET_DIR}" \
              cargo install dioxus-cli \
                --version "${DIOXUS_CLI_VERSION}" \
                --locked \
                --root "${DIOXUS_CLI_ROOT}" \
                --force
          fi
          echo "${DIOXUS_CLI_ROOT}/bin" >> "${GITHUB_PATH}"
          "${DIOXUS_CLI_ROOT}/bin/dx" --version

      - name: Run workspace tests with import feature
        run: cargo test -r --workspace --features jbotci-dictionary/import

      - name: Run wasm stack probe (debug)
        env:
          HOME: ${{ env.DIOXUS_HOME }}
        run: cargo run -r -p xtask-full -- wasm-stack-test --profile debug

      - name: Run wasm stack probe (release)
        env:
          HOME: ${{ env.DIOXUS_HOME }}
        run: cargo run -r -p xtask-full -- wasm-stack-test --profile release

      - name: Run fixture tests
        run: cargo run -r -p xtask-full -- fixture-test --profile all

      - name: Assert native application graphs contain no wgpu
        run: |
          cargo tree -p jbotci > "${RUNNER_TEMP}/jbotci-native-tree.txt"
          cargo tree -p jbotci-app --features native-desktop > "${RUNNER_TEMP}/jbotci-app-native-tree.txt"
          if grep -Eq '(^| )wgpu v|jbotci-f2llm-runtime' \
              "${RUNNER_TEMP}/jbotci-native-tree.txt" \
              "${RUNNER_TEMP}/jbotci-app-native-tree.txt"; then
            echo "Native application dependency graph unexpectedly contains the F2LLM/wgpu stack" >&2
            exit 1
          fi

      - name: Stamp test target cache
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/cargo-cache-mtimes
        with:
          mode: stamp
          target-dir: .github-cache/cargo-target/test

      - name: Save cargo home cache
        if: ${{ github.event_name != 'pull_request' && steps.cargo-home-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .github-cache/cargo
          key: ${{ steps.cargo-home-cache.outputs.cache-primary-key }}

      - name: Save Dioxus CLI cache
        if: ${{ github.event_name != 'pull_request' && steps.dioxus-cli-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .github-cache/dioxus-cli/${{ env.DIOXUS_CLI_VERSION }}
          key: ${{ steps.dioxus-cli-cache.outputs.cache-primary-key }}

      - name: Save test target cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .github-cache/cargo-target/test
            .github-cache/home/.dx
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  f2llm-native-lavapipe:
    name: F2LLM 80m native goldens (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rust:1-trixie
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.github-cache/cargo-target/f2llm-lavapipe
      CARGO_BUILD_JOBS: 4
      WGPU_BACKEND: vulkan
      JBOTCI_F2LLM_ARTIFACT_ROOT: ${{ github.workspace }}/.github-cache/f2llm-native-artifacts
      JBOTCI_F2LLM_GOLDEN_MODE: 80m
      JBOTCI_F2LLM_FORCE_FALLBACK_ADAPTER: 1
    steps:
      - name: Install lavapipe
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git mesa-vulkan-drivers python3 time
          mapfile -t lavapipe_icds < <(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd(\.[^.]+)?\.json$')
          if [ "${#lavapipe_icds[@]}" -ne 1 ]; then
            echo "Expected exactly one lavapipe Vulkan ICD, found ${#lavapipe_icds[@]}" >&2
            printf '%s\n' "${lavapipe_icds[@]}" >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=${lavapipe_icds[0]}" >> "${GITHUB_ENV}"
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download verified published 80m WebGPU artifact
        run: |
          # Regenerate consciously (copy the digest below and the component pin into
          # tools/f2llm-oracles/webgpu-artifact-identity-pins.json):
          # python3 tools/f2llm-oracles/download-webgpu-artifacts.py \
          #   --manifest-url https://assets.jbotci.app/models/f2llm-v2-80m-webgpu/v1/manifest.json \
          #   --print-artifact-identity
          python3 tools/f2llm-oracles/download-webgpu-artifacts.py \
            --manifest-url https://assets.jbotci.app/models/f2llm-v2-80m-webgpu/v1/manifest.json \
            --expected-artifact-identity 6aa5a067235c8b8a78855e2ebed1d112db5a1a702ae228686bf10eae4b3834aa \
            --base-url https://assets.jbotci.app/models/f2llm-v2-80m-webgpu/v1/ \
            --out "${JBOTCI_F2LLM_ARTIFACT_ROOT}/f2llm-v2-80m-q4-320"

      - name: Run only the 80m native golden suite
        run: |
          /usr/bin/time -f 'lavapipe 80m native goldens wall time: %E' \
            cargo test -r -p jbotci-f2llm-runtime --features native \
              --test native_goldens -- --nocapture
