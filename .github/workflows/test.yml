name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: Cargo tests
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    env:
      CARGO_HOME: ${{ github.workspace }}/.github-cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.github-cache/cargo-target/test
      CARGO_BUILD_JOBS: 4
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake git libclang-dev pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .github-cache/cargo
            .github-cache/cargo-target/test
          key: jbotci-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            jbotci-test-${{ runner.os }}-

      - name: Run workspace tests with import feature
        run: cargo test -r --workspace --features jbotci-dictionary/import

      - name: Run fixture tests
        run: cargo run -r -p xtask-full -- fixture-test --profile all

      - name: Save cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .github-cache/cargo
            .github-cache/cargo-target/test
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
