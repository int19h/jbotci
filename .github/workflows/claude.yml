name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two gates before a runner is even allocated: only the repo owner's own
    # comments/issues/reviews count (else anyone could spend credits/minutes),
    # and the relevant text must plausibly contain this leg's phrase (a plain
    # substring check - the action itself re-checks with an exact word-boundary
    # regex and no-ops harmlessly on a false-positive substring match, e.g.
    # "@claude" against "@claude-opus"). Without the second half, every
    # qualifying event - even ones that never mention Claude at all - would
    # spin up all 5 matrix legs. The action also requires collaborator write
    # access as a further, independent check.
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, matrix.phrase)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, matrix.phrase)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, matrix.phrase)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, matrix.phrase) || contains(github.event.issue.title, matrix.phrase)))
      )
    name: Claude Code (${{ matrix.phrase }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - phrase: "@claude"
            model_arg: ""
          - phrase: "@claude-sonnet"
            model_arg: "--model claude-sonnet-5"
          - phrase: "@claude-opus"
            model_arg: "--model claude-opus-4-8"
          - phrase: "@claude-fable"
            model_arg: "--model claude-fable-5"
          - phrase: "@claude-haiku"
            model_arg: "--model claude-haiku-4-5-20251001"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results when reviewing a PR
      id-token: write # exchanged for the claude[bot] App token; not used for pushes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ matrix.phrase }}
          # contents: read above already blocks pushes; disallowing the edit tools too
          # keeps this workflow strictly a reviewer/analyst, not an agentic coder.
          claude_args: |
            ${{ matrix.model_arg }}
            --disallowedTools "Edit,Write,NotebookEdit"
