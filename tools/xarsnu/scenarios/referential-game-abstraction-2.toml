id = "referential-game-abstraction-2"
title = "Abstract scene contrasts B"
public-setup = "One speaker privately receives a target scene. Listeners must identify its one-based index from the speaker's descriptions."
scenario-type = "referential-game"
minimum-rounds = 1
maximum-rounds = 3
maximum-turns = 8
target-scene-index = 4

[answer-schema]
type = "object"
additionalProperties = false
required = ["scene_index"]

[answer-schema.properties.scene_index]
type = "integer"
minimum = 1

# Attachment site: the singing clause modifies the doctor nested in the greeting subject.
