description = "The friend of the doctor-who-sings greets the child."

# Attachment site: the singing clause modifies the friend who is the greeting subject.
[[scenes]]
description = "The friend of the doctor greets the child, and it is the friend who sings."

# Attachment site: the singing clause modifies the child who is the greeting object.
[[scenes]]
description = "The friend of the doctor greets the child-who-sings."

# Attachment site: the singing clause modifies the doctor nested in the greeting object.
[[scenes]]
description = "The child greets the friend of the doctor, and it is the doctor who sings."

