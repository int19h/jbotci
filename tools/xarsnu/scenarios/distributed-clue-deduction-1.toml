id = "distributed-clue-deduction-1"
title = "Professions and cities I"
public-setup = "Determine the unique profession and city assigned to each person. Every participant holds only part of the clue set. Submit the complete assignment."
scenario-type = "distributed-clue-deduction"
minimum-rounds = 1
maximum-rounds = 3
maximum-turns = 5
people = ["Ada", "Ben", "Cy"]
professions = ["doctor", "engineer", "teacher"]
cities = ["Lima", "Oslo", "Rome"]

[answer-schema]
type = "object"
additionalProperties = false
required = ["assignments"]

[answer-schema.properties.assignments]
type = "array"
minItems = 1

[answer-schema.properties.assignments.items]
type = "object"
additionalProperties = false
required = ["person", "profession", "city"]

[answer-schema.properties.assignments.items.properties.person]
type = "string"
minLength = 1

[answer-schema.properties.assignments.items.properties.profession]
type = "string"
minLength = 1

[answer-schema.properties.assignments.items.properties.city]
type = "string"
minLength = 1

[[participants]]
name = "alice"
clues = [
  { kind = "profession", person = "Ada", profession = "doctor", matches = true },
  { kind = "city", person = "Ben", city = "Oslo", matches = true },
]

[[participants]]
name = "bob"
clues = [
  { kind = "profession", person = "Cy", profession = "teacher", matches = true },
  { kind = "city", person = "Ada", city = "Lima", matches = true },
]

[[solution]]
person = "Ada"
profession = "doctor"
city = "Lima"

[[solution]]
person = "Ben"
profession = "engineer"
city = "Oslo"

[[solution]]
person = "Cy"
profession = "teacher"
city = "Rome"
