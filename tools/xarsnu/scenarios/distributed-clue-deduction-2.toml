id = "distributed-clue-deduction-2"
title = "Professions and cities II"
public-setup = "Determine the unique profession and city assigned to each person. Every participant holds only part of the clue set. Submit the complete assignment."
scenario-type = "distributed-clue-deduction"
minimum-rounds = 1
maximum-rounds = 3
maximum-turns = 5
people = ["Inez", "Jun", "Kofi"]
professions = ["baker", "pilot", "scientist"]
cities = ["Accra", "Kyoto", "Quito"]

[answer-schema]
type = "object"
additionalProperties = false
required = ["assignments"]

[answer-schema.properties.assignments]
type = "array"
minItems = 1

[answer-schema.properties.assignments.items]
type = "object"
additionalProperties = false
required = ["person", "profession", "city"]

[answer-schema.properties.assignments.items.properties.person]
type = "string"
minLength = 1

[answer-schema.properties.assignments.items.properties.profession]
type = "string"
minLength = 1

[answer-schema.properties.assignments.items.properties.city]
type = "string"
minLength = 1

[[participants]]
name = "alice"
clues = [
  { kind = "profession", person = "Inez", profession = "pilot", matches = true },
  { kind = "city", person = "Jun", city = "Kyoto", matches = true },
]

[[participants]]
name = "bob"
clues = [
  { kind = "profession", person = "Kofi", profession = "baker", matches = true },
  { kind = "city", person = "Inez", city = "Quito", matches = true },
]

[[solution]]
person = "Inez"
profession = "pilot"
city = "Quito"

[[solution]]
person = "Jun"
profession = "scientist"
city = "Kyoto"

[[solution]]
person = "Kofi"
profession = "baker"
city = "Accra"
