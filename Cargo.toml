[profile.desktop-dev]
inherits = "dev"

# `dx serve --web` and `dx build --web` use this profile.
# A debug build reduces debug info only for a crate that causes a real failure.
# A larger module that still loads is not such a failure.
# The ready signal waits for as long as the load takes.
# opt-level 0 makes the loaded module slow. opt-level 1 is the measured fix.
# These sizes are the cargo wasm file, before dx removes the name section.
# The baseline raw module is 199,910,110 bytes. Its code section is 77,616,480 bytes.
# With opt-level 1 and line tables, the raw module is 203,731,482 bytes.
# Its code section is 60,695,813 bytes. Its data section is 23,239,805 bytes.
# Its DWARF is 89,345,763 bytes. Its name section is 29,274,362 bytes.
# A clean build took 733 seconds. One new line in jbotci-ui rebuilt in 29 seconds.
# Line tables stay on, so a wasm stack trace still has a file and a line.
# `dx serve` keeps DWARF on a debug build. It drops the name section.
# Pass --keep-names to keep that section.
# opt-level 1 with debug info off makes a raw module of 114,322,375 bytes.
# Its code section is 60,661,632 bytes. Its DWARF is 0. Its name section is 29,246,159 bytes.
# That module is smaller. It is not the chosen build, because it still loads.
# With debug info off, the default serve has no file, no line, and no function name.
# Line tables on only jbotci-ui and jbotci-gentufa make a raw module of 133,966,795 bytes.
# The other crates then have no file and no line in the trace.
# A higher opt-level on only the heavy crates leaves the other crates at opt-level 0.
# That raw module is 192,862,993 bytes, and the other crates stay slow.
# Native debug builds use the dev profile. Release builds use the release profile.
# This block changes neither profile.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3
codegen-units = 16

# Native debug builds of jbotci-syntax carry line tables for source locations in backtraces and gdb.
# Generated combinator types give monomorphized functions long names.
# DWARF32 uses 32-bit offsets into .debug_str, so full debug information can exceed its address range.
# Line tables reduce debug data but still contain function names. Issue #936 covers this constraint.
# If line tables exceed the limit, set this package's debug value to false.
# split-debuginfo = "unpacked" retains full debug information in separate .dwo files at a larger disk cost.
# The profiles that inherit dev (test, desktop-dev) get this override too; wasm-dev
# sets its own below. Package overrides are not read from CARGO_PROFILE_* environment
# variables; for full debug info in a one-off cargo build, pass
# --config 'profile.dev.package.jbotci-syntax.debug="full"'.
[profile.dev.package.jbotci-syntax]
debug = "line-tables-only"

# The web debug build of jbotci-syntax carries no debug info.
# This is the one crate whose debug info causes a real failure.
# Line tables name every monomorphized function in .debug_str.
# The generated grammar uses combinator types, and those names are enormous.
# On their own, the line tables exceed the V8 1 GiB WebAssembly module limit.
# They also exceed the rust-lld 2 GiB section limit.
# lld crashes when it links a module past that limit.
# Every other crate keeps the line tables from the profile above.
# A wasm stack trace for those crates still has a file and a line.
# Native debug builds of this crate keep line tables. See the dev override above.
# The underlying growth is #936.
# Package overrides are not read from CARGO_PROFILE_* environment variables.
# CARGO_PROFILE_WASM_DEV_DEBUG=full does not change this crate.
# For one cargo build that restores line tables for this crate only, pass
# --config 'profile.wasm-dev.package.jbotci-syntax.debug="line-tables-only"'.
[profile.wasm-dev.package.jbotci-syntax]
opt-level = 1
debug = false

[profile.release.build-override]
opt-level = 3
codegen-units = 16

[profile.desktop-dev.build-override]
opt-level = 3
codegen-units = 16

[lints]
workspace = true

[workspace.lints.rust]
missing_debug_implementations = "warn"
