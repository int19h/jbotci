[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Pavel Minaev"]
repository = "https://github.com/int19h/jbotci"

[package]
name = "jbotci-workspace"
description = "Workspace-level integration tests for jbotci."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
expensive_contracts = []

[dependencies]
bityzba.workspace = true
jbotci-diagnostics.workspace = true

