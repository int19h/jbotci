[package]
name = "jbotci-semantics"
description = "Lojban semantic model and builder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# `build.rs` verifies the retained smusni-v0 bundle against its own generator
# sources on every build, and the bundle CLI is one of those sources, so it must
# stay inside the published package even though the other examples do not.
exclude = [
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "!/examples/smusni_v0_bundle.rs",
]

[features]
expensive_contracts = []

[dependencies]
bityzba.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
jbotci-source.workspace = true
jbotci-dictionary.workspace = true
jbotci-jvozba.workspace = true
jbotci-morphology.workspace = true
jbotci-syntax.workspace = true
jbotci-tree.workspace = true
vec1.workspace = true

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }
num-bigint.workspace = true
num-integer.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
syn.workspace = true

[dev-dependencies]
jbotci-dictionary-data.workspace = true
jbotci-dialect.workspace = true
roxmltree.workspace = true
sha2.workspace = true
toml.workspace = true
syn.workspace = true

[lints]
workspace = true
