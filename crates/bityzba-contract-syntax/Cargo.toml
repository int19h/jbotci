[package]
name = "bityzba-contract-syntax"
description = "Shared token-level syntax helpers for bityzba contract macros."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
authors.workspace = true
repository.workspace = true
publish = false
exclude = ["/tests/**", "/benches/**", "/examples/**"]

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["extra-traits", "full"] }

[dev-dependencies]
quote = "1"

[lints]
workspace = true
