[package]
name = "jbotci-f2llm-runtime"
description = "Shared jbotci F2LLM tokenizer, WebGPU runtime, and artifact contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
expensive_contracts = []
native = ["dep:bytemuck", "dep:futures-channel", "dep:wgpu"]

[dependencies]
bityzba.workspace = true
fancy-regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { workspace = true }
futures-channel = { workspace = true }
wgpu = { workspace = true, features = ["std", "webgpu", "wgsl"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "linux"))'.dependencies]
bytemuck = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true, features = ["std", "vulkan", "gles", "wgsl"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
bytemuck = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true, features = ["std", "dx12", "vulkan", "gles", "wgsl"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
bytemuck = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true, features = ["std", "metal", "gles", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }

[lints]
workspace = true
