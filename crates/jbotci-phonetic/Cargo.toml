[package]
name = "jbotci-phonetic"
description = "IPA rendering and phonetic similarity support for jbotci."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
exclude = ["/tests/**", "/benches/**", "/examples/**"]

[features]
expensive_contracts = []

[dependencies]
jbotci-budget.workspace = true
bityzba.workspace = true
jbotci-interrupt.workspace = true
jbotci-morphology.workspace = true
serde.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
jbotci-interrupt = { workspace = true, features = ["cancellation_test_hook"] }

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }

[lints]
workspace = true
