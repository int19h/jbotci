[package]
name = "jbotci-embeddings"
description = "Embedding model, vector pack, and semantic search support for jbotci."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
expensive_contracts = []
native-llama = ["dep:llama-cpp-4", "dep:llama-cpp-sys-4"]
# Run llama.cpp on the GPU through Metal (macOS). For building embedding packs
# on a Mac; the vectors differ from the CPU's only in the last digits.
metal = ["native-llama", "llama-cpp-sys-4/metal"]
# Compile llama.cpp for the build machine's own CPU (-mcpu=native), about 1.7x
# faster on Apple silicon. The binary may not run on other CPUs, so this is for
# local pack builds only, never for distributed binaries.
native-cpu = ["native-llama", "llama-cpp-sys-4/native"]

[dependencies]
bityzba.workspace = true
brotli.workspace = true
directories.workspace = true
jbotci-cll.workspace = true
jbotci-dictionary.workspace = true
jbotci-dictionary-data.workspace = true
jbotci-embedding-inputs.workspace = true
llama-cpp-4 = { workspace = true, optional = true }
llama-cpp-sys-4 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
