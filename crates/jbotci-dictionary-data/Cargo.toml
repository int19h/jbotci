[package]
name = "jbotci-dictionary-data"
description = "Embedded Lensisku dictionary data for jbotci."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
exclude = ["/tests/**", "/benches/**", "/examples/**"]

[features]
expensive_contracts = []

[dependencies]
bityzba.workspace = true
jbotci-dictionary.workspace = true
jbotci-phonetic.workspace = true

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }
jbotci-dictionary = { workspace = true, features = ["import"] }
jbotci-jvozba.workspace = true
jbotci-morphology.workspace = true
jbotci-phonetic.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
toml.workspace = true

[lints]
workspace = true
