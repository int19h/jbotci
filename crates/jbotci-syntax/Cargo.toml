[package]
name = "jbotci-syntax"
description = "Lojban syntax model and parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
exclude = ["/tests/**", "/benches/**", "/examples/**"]

[features]
expensive_contracts = []

[dependencies]
bityzba.workspace = true
jbotci-diagnostics.workspace = true
jbotci-dialect.workspace = true
serde.workspace = true
thiserror.workspace = true
jbotci-morphology.workspace = true
jbotci-source.workspace = true
jbotci-syntax-macros.workspace = true
jbotci-tree.workspace = true
serde_json.workspace = true
smallvec.workspace = true
stacker.workspace = true
vec1.workspace = true

[build-dependencies]
bityzba = { workspace = true, features = ["contract_scanner"] }

[dev-dependencies]
jbotci-syntax-binding-schema-test-macro = { path = "../jbotci-syntax-macros/tests/binding-schema-consumer" }

[lints]
workspace = true
